<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tendência Fitness</title>
<meta name="description" content="Moda fitness feminina em Natal/RN. Fale no WhatsApp ou venha nos visitar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#F7D8DD;
    --pink-deep:#EEC0CA;
    --pink-pale:#FBEBEE;
    --gold:#B7926A;
    --gold-light:#DCC29C;
    --gold-dark:#8F6B47;
    --ink:#181414;
    --white:#FFFDFB;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    min-height:100vh;
    background:
      radial-gradient(90% 60% at 18% 8%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 45%),
      radial-gradient(120% 90% at 82% 100%, var(--pink-deep) 0%, transparent 55%),
      linear-gradient(160deg, var(--pink-pale) 0%, var(--pink) 55%, var(--pink-deep) 100%);
    font-family:'Jost', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:7vh 20px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:rgba(255,253,251,.55);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(183,146,106,.35);
    border-radius:32px;
    padding:44px 30px 34px;
    box-shadow:
      0 30px 60px -30px rgba(120,80,60,.35),
      inset 0 1px 0 rgba(255,255,255,.6);
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    animation:fadeCard .8s ease forwards;
  }

  @keyframes fadeCard{ to{ opacity:1; } }

  .glow{
    position:absolute;
    top:-60px;
    width:220px;
    height:140px;
    background:radial-gradient(closest-side, rgba(220,194,156,.85), rgba(220,194,156,0));
    filter:blur(6px);
    z-index:0;
    opacity:0;
    animation:reveal 1s cubic-bezier(.22,.68,.36,1) forwards;
    animation-delay:.1s;
  }

  .logo{
    position:relative;
    z-index:1;
    width:min(66vw, 250px);
    height:auto;
    opacity:0;
    transform:translateY(10px) scale(.97);
    animation:reveal .9s cubic-bezier(.22,.68,.36,1) forwards;
    animation-delay:.15s;
  }

  .tagline{
    margin:18px 0 0;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.24rem;
    color:var(--gold-dark);
    text-align:center;
    letter-spacing:.01em;
    opacity:0;
    animation:reveal .9s cubic-bezier(.22,.68,.36,1) forwards;
    animation-delay:.3s;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0 26px;
    width:100%;
    max-width:220px;
    opacity:0;
    animation:reveal .9s cubic-bezier(.22,.68,.36,1) forwards;
    animation-delay:.42s;
  }
  .divider span{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .divider span.right{ background:linear-gradient(90deg, var(--gold), transparent); }
  .divider i{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); display:block; flex:none; }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 20px;
    border-radius:999px;
    text-decoration:none;
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-size:.98rem;
    font-weight:500;
    letter-spacing:.01em;
    border:1px solid rgba(183,146,106,.55);
    background:rgba(255,255,255,.4);
    transition:transform .18s ease, box-shadow .18s ease;
    opacity:0;
    animation:reveal .9s cubic-bezier(.22,.68,.36,1) forwards;
  }
  .links .btn:nth-child(1){ animation-delay:.54s; }
  .links .btn:nth-child(2){ animation-delay:.66s; }
  .links .btn:nth-child(3){ animation-delay:.78s; }

  .btn:active{ transform:scale(.97); }

  .btn.primary{
    background:linear-gradient(120deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    border-color:transparent;
    color:var(--white);
    box-shadow:0 12px 26px -10px rgba(143,107,71,.6);
  }

  .btn .icon{
    width:38px;
    height:38px;
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.55);
  }
  .btn.primary .icon{ background:rgba(255,255,255,.28); }
  .btn .icon svg{ width:19px; height:19px; }

  .btn .label{
    display:flex;
    flex-direction:column;
    line-height:1.25;
  }
  .btn .label small{
    font-size:.72rem;
    font-weight:400;
    letter-spacing:.02em;
    opacity:.75;
  }

  .address{
    max-width:300px;
    margin-top:26px;
    text-align:center;
    font-size:.84rem;
    line-height:1.6;
    color:var(--gold-dark);
    opacity:0;
    animation:reveal .9s cubic-bezier(.22,.68,.36,1) forwards;
    animation-delay:.9s;
  }

  .footer{
    margin-top:16px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    color:var(--ink);
    font-size:.86rem;
    letter-spacing:.01em;
    opacity:0;
    animation:reveal .9s cubic-bezier(.22,.68,.36,1) forwards;
    animation-delay:1s;
  }
  .footer svg{ width:16px; height:16px; flex:none; }

  @keyframes reveal{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .glow, .logo, .tagline, .divider, .btn, .address, .footer{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  .btn:focus-visible, .footer:focus-visible{
    outline:2px solid var(--gold-dark);
    outline-offset:3px;
  }
</style>
</head>
<body>

  </div>
</body>
</html>
